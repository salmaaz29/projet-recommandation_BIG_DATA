version: "3.8"

# ================================================================
#  Airflow — Personne 3
#  Image personnalisée avec Java 11 + PySpark + kafka-python
#
#  PREMIERE FOIS :
#    docker-compose -f docker-compose-airflow.yml build
#    docker-compose -f docker-compose-airflow.yml up airflow-init
#    docker-compose -f docker-compose-airflow.yml up -d airflow-webserver airflow-scheduler
#
#  ENSUITE :
#    docker-compose -f docker-compose-airflow.yml up -d airflow-webserver airflow-scheduler
# ================================================================

x-airflow-common: &airflow-common
  build: .
  image: airflow-custom:latest
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    JAVA_HOME: "/usr/lib/jvm/temurin-11-jdk-amd64"
    PYSPARK_PYTHON: "python3"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../:/opt/airflow/project
  # Connecté aux DEUX réseaux :
  # - airflow_default : réseau interne Airflow (postgres, webserver, scheduler)
  # - kafka_net       : réseau Kafka pour atteindre le conteneur kafka
  networks:
    - airflow_default
    - kafka_net
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:13
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - airflow_default

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always

networks:
  # Réseau interne Airflow (créé automatiquement)
  airflow_default:
    driver: bridge

  # Réseau Kafka existant (déjà créé par docker-compose.yml de Personne 1)
  # On l'importe avec external: true — on ne le recrée pas
  kafka_net:
    external: true
    name: projet-recommandation_big_data_default

volumes:
  postgres_data: